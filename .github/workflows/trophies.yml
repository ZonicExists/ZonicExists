name: Generate Trophies

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Trophies
        run: |
          URLS=(
            "https://gh-trophy.cdnsoft.net"
            "https://github-profile-trophy.vercel.app"
            "https://trophygithubreadmelang.cybee.dpdns.org"
            "https://github-profile-trophy-liard-delta.vercel.app"
            "https://github-profile-trophy-fork-two.vercel.app"
            "https://github-profile-trophy-winning.vercel.app"
            "https://github-profile-trophy-kannan.vercel.app"
            "https://trophy.ryglcloud.net"
            "https://github-profile-trophy-tawny.vercel.app"
            "https://github-profile-repo.vercel.app"
            "https://trophygh.kolioaris.xyz"
            "https://github-profile-trophy-orcin-eta.vercel.app"
            "https://github-profile-trophy-reiyua-mirror.vercel.app"
            "https://github-profile-trophy-sigma-one.vercel.app"
            "https://trophy.benkou.dev"
            "https://github-trophies.devomb.com"
            "https://github-profile-trophy-unserori.vercel.app"
          )

          PARAMS="?username=zonicisalive&theme=tokyonight&no-frame=true&no-bg=true"
          
          for url in "${URLS[@]}"; do
            echo "Attempting to fetch trophy from: $url"
            if curl -f -s "${url}${PARAMS}" -o github-profile-trophy.svg; then
              echo "Successfully downloaded trophy SVG from $url"
              exit 0
            fi
            echo "Failed to fetch from $url, trying next mirror..."
          done

          echo "Error: All trophy mirrors failed."
          exit 1

      - name: Commit and Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Update trophies" || exit 0
          git push
          
